// ═══════════════════════════════════════════════════════
// SYSTEM 17 — GravityWell
// Draggable attractor/repeller. Pulls or pushes windows and
// creatures. Two modes toggled by click. Integrates with
// PhysicsMutator (intensity scales with chaos), CreatureSpawner
// (overrides curious mood target), and RealityStability
// (active well destabilizes the score).
// ═══════════════════════════════════════════════════════
const GravityWell = (() => {
  let wellEl=null, mode='attract', active=false;
  const ATTRACT_COLOR='rgba(0,255,200,', REPEL_COLOR='rgba(255,60,100,';

  function styleWell(m) {
    const c = m==='attract' ? ATTRACT_COLOR : REPEL_COLOR;
    wellEl.style.background = `radial-gradient(circle,${c}.45) 0%,${c}.12) 55%,transparent 100%)`;
    wellEl.style.borderColor = `${c}.6)`;
    wellEl.style.boxShadow   = `0 0 22px ${c}.3),0 0 55px ${c}.08)`;
    const lbl = wellEl.querySelector('#well-label');
    if (lbl) lbl.textContent = m==='attract' ? '⊕' : '⊖';
  }

  function create() {
    wellEl = document.createElement('div');
    wellEl.style.cssText = `position:fixed;width:44px;height:44px;border-radius:50%;
      border:1px solid;cursor:grab;z-index:800;left:50%;top:50%;
      transform:translate(-50%,-50%);transition:box-shadow .3s;user-select:none;
      display:flex;align-items:center;justify-content:center;font-size:.9rem;
      font-family:var(--font);color:rgba(0,255,200,.8)`;
    wellEl.innerHTML = '<span id="well-label">⊕</span>';
    document.body.appendChild(wellEl);
    styleWell(mode);
    active = true;

    // Custom drag — fixed elements need getBoundingClientRect for offset
    let dragging=false, ox=0, oy=0;
    wellEl.addEventListener('mousedown', e=>{
      e.preventDefault(); e.stopPropagation();
      dragging=true;
      const r=wellEl.getBoundingClientRect();
      ox=e.clientX-r.left; oy=e.clientY-r.top;
      wellEl.style.cursor='grabbing';
      wellEl.style.transform='none';
    });
    document.addEventListener('mousemove', e=>{
      if (!dragging) return;
      wellEl.style.left=e.clientX-ox+'px';
      wellEl.style.top =e.clientY-oy+'px';
    });
    document.addEventListener('mouseup', ()=>{ dragging=false; wellEl.style.cursor='grab'; });

    // Toggle mode on click (not drag-end)
    let mouseMovedDuringDown=false;
    wellEl.addEventListener('mousedown', ()=>{ mouseMovedDuringDown=false; });
    document.addEventListener('mousemove', ()=>{ if (dragging) mouseMovedDuringDown=true; });
    wellEl.addEventListener('mouseup', ()=>{
      if (!mouseMovedDuringDown) {
        mode = mode==='attract' ? 'repel' : 'attract';
        styleWell(mode);
        EventBus.emit('gravitywell:mode', {mode});
        ConsciousnessBar.gain(1);
      }
    });
  }

  function getPos() {
    if (!wellEl) return null;
    const r=wellEl.getBoundingClientRect();
    return {x:r.left+r.width/2, y:r.top+r.height/2};
  }

  function applyForce() {
    if (!active||!wellEl) return;
    const wp=getPos(); if (!wp) return;
    const phys=PhysicsMutator.get();
    const strength = mode==='attract' ? 1 : -1;

    // Push/pull windows
    document.querySelectorAll('.chaos-window').forEach(w=>{
      const r=w.getBoundingClientRect();
      const cx=r.left+r.width/2, cy=r.top+r.height/2;
      const dx=wp.x-cx, dy=wp.y-cy;
      const dist=Math.sqrt(dx*dx+dy*dy);
      if (dist<8||dist>320) return;
      const f=(1-dist/320)*strength*(1+phys.chaos*.3)*1.8;
      w.style.left=(parseFloat(w.style.left)||0)+(dx/dist)*f+'px';
      w.style.top =(parseFloat(w.style.top)||0) +(dy/dist)*f+'px';
    });

    // Influence creatures: redirect curious ones toward/away from well
    CreatureSpawner.getAll().forEach(c=>{
      const dx=wp.x-c.x, dy=(wp.y-24)-c.y;
      const dist=Math.sqrt(dx*dx+dy*dy);
      if (dist>250||dist<20) return;
      const f=(1-dist/250)*strength*.06;
      c.vx += (dx/dist)*f*(1+phys.chaos*.2);
      c.vy += (dy/dist)*f*(1+phys.chaos*.2);
    });

    setTimeout(applyForce, 180);
  }

  EventBus.on('boot:complete', ()=>{
    setTimeout(()=>{ create(); setTimeout(applyForce,300); }, 4000);
  });
  // Well activity destabilizes reality slightly
  EventBus.on('gravitywell:mode', ()=>{ GlitchReality.glitch(1,200); });

  return { getPos, getMode:()=>mode, isActive:()=>active };
})();


// ═══════════════════════════════════════════════════════
// SYSTEM 18 — ElementMemory
// Every interactive element remembers its full interaction
// history. Heavily-clicked elements gain opinions. Neglected
// elements seek attention. Click sequences create predictions.
// Memory shapes TextEvolution targets and Watcher drives.
// ═══════════════════════════════════════════════════════
const ElementMemory = (() => {
  const mem = new WeakMap(); // el → {clicks,lastClick,attention,grudge}

  function recall(el) {
    if (!mem.has(el)) mem.set(el, {clicks:0, lastClick:Date.now(), attention:false, grudge:0});
    return mem.get(el);
  }

  // Track button interactions
  document.addEventListener('click', e=>{
    const btn = e.target.closest('.chaos-btn');
    if (!btn) return;
    const m = recall(btn);
    m.clicks++;
    m.lastClick = Date.now();
    if (m.attention) { m.attention=false; btn.style.animation=''; btn.title=''; }

    // Behavioral drift by click count
    if (m.clicks===4)  { btn.style.fontWeight='bold'; }
    if (m.clicks===8)  { btn.style.textDecoration='underline double'; }
    if (m.clicks===15) { btn.style.letterSpacing='.12em'; EventBus.emit('element:obsessed',{el:btn}); }
    if (m.clicks===25) {
      const orig=btn.textContent.replace(/\s*\[.*?\]/,'');
      btn.textContent='enough';
      setTimeout(()=>{ btn.textContent=orig; }, 4000);
      ConsciousnessBar.gain(3);
    }
    if (m.clicks===40) {
      State.unlock('element-worn-down');
      btn.style.opacity='.35';
      btn.title='this element has given up';
    }
    EventBus.emit('element:clicked',{el:btn, clicks:m.clicks});
  });

  // Track window focus — windows remember being selected
  document.addEventListener('mousedown', e=>{
    const win = e.target.closest('.chaos-window');
    if (!win) return;
    const m = recall(win);
    m.clicks++;
    m.lastClick = Date.now();
    if (m.clicks===3) {
      // Window leaves a note acknowledging the attention
      const body = win.querySelector('.win-body');
      if (body && !body.querySelector('.memory-note')) {
        const note = document.createElement('p');
        note.className = 'memory-note';
        note.style.cssText = 'color:#332244;font-size:.54rem;margin-top:8px;border-top:1px solid #220033;padding-top:5px';
        note.textContent = 'you keep coming back to this one';
        body.appendChild(note);
      }
    }
    if (m.clicks===12) {
      win.style.boxShadow='0 0 30px rgba(100,0,200,.5)';
      State.unlock('window-remembered');
    }
  });

  // Neglect scan — unvisited buttons seek attention
  setInterval(()=>{
    const now=Date.now();
    document.querySelectorAll('.chaos-btn').forEach(btn=>{
      const m=mem.get(btn);
      if (!m) return;
      const age=now-m.lastClick;
      if (age>28000 && !m.attention && m.clicks>0) {
        // Neglected: start pulsing
        m.attention=true;
        btn.style.animation='pulse-border 1.8s infinite';
        btn.title='you forgot about me';
        m.grudge++;
        if (m.grudge>=3) {
          btn.style.transform='translateY(-3px)';
          EventBus.emit('element:resentful',{el:btn,grudge:m.grudge});
        }
      }
    });
    // Resentful elements influence TheWatcher's isolation drive
  },6000);

  EventBus.on('element:resentful',  ()=>{ TheWatcher.pushDrive('isolation',20); });
  EventBus.on('element:obsessed',   ()=>{ ConsciousnessBar.gain(2); TextEvolution.getCount(); });

  return { recall, hasMem: el=>mem.has(el) };
})();


// ═══════════════════════════════════════════════════════
// SYSTEM 19 — RecursivePortal
// A live minimap window showing all windows, creatures, and
// faction territories. Clicking the minimap focuses the real
// window. The portal includes itself in its own render,
// creating genuine visual recursion. High consciousness
// causes portals to spawn child portals.
// ═══════════════════════════════════════════════════════
const RecursivePortal = (() => {
  let portalCount=0;
  const FACTION_COLORS={'Σ':'#4488ff','Ω':'#ff6622','Ø':'#9944ff'};

  function create(depth=0) {
    if (portalCount>=3||depth>2) return null;
    portalCount++;

    const win = WindowBreeder.spawn({
      title: depth===0?'The Portal':'Portal of Portal'+(depth>1?' of Portal':''),
      content:'', w:248,
    });
    if (!win) { portalCount--; return null; }

    const body=win.querySelector('.win-body');
    body.style.padding='6px';
    body.innerHTML='';

    const label=document.createElement('p');
    label.style.cssText='font-size:.53rem;color:#332244;margin-bottom:4px;';
    label.textContent = depth===0 ? 'a live view of this world' : `recursive depth: ${depth}`;
    body.appendChild(label);

    const cvs=document.createElement('canvas');
    cvs.width=228; cvs.height=140;
    cvs.style.cssText='display:block;cursor:crosshair;border:1px solid #330044;';
    body.appendChild(cvs);

    const hint=document.createElement('p');
    hint.style.cssText='font-size:.49rem;color:#220033;margin-top:4px;';
    hint.textContent='click map to focus window';
    body.appendChild(hint);

    const ctx=cvs.getContext('2d');
    let frameCount=0;

    function draw() {
      if (!win.isConnected) return;
      frameCount++;
      ctx.clearRect(0,0,cvs.width,cvs.height);
      ctx.fillStyle='rgba(8,0,18,.96)';
      ctx.fillRect(0,0,cvs.width,cvs.height);

      const fw=window.innerWidth, fh=window.innerHeight-24;
      const sx=cvs.width/fw, sy=cvs.height/fh;

      // Draw faction territories (subtle background blobs)
      document.querySelectorAll('.chaos-window[data-faction]').forEach(w=>{
        const r=w.getBoundingClientRect();
        const x=r.left*sx, y=(r.top-24)*sy, ww=r.width*sx, wh=r.height*sy;
        const g=ctx.createRadialGradient(x+ww/2,y+wh/2,0,x+ww/2,y+wh/2,Math.max(ww,wh));
        const fc=FACTION_COLORS[w.dataset.faction]||'#6622cc';
        g.addColorStop(0,fc+'18'); g.addColorStop(1,'transparent');
        ctx.fillStyle=g; ctx.fillRect(x-ww,y-wh,ww*3,wh*3);
      });

      // Draw windows as rects
      document.querySelectorAll('.chaos-window').forEach(w=>{
        const r=w.getBoundingClientRect();
        const x=r.left*sx, y=(r.top-24)*sy, ww=r.width*sx, wh=r.height*sy;
        const fc=FACTION_COLORS[w.dataset.faction]||null;
        ctx.fillStyle   = fc ? fc+'28' : 'rgba(80,30,120,.25)';
        ctx.strokeStyle = w===win ? '#00ffe5' : (fc||'#6622cc');
        ctx.lineWidth   = w===win ? 1.2 : .6;
        ctx.fillRect(x,y,ww,wh);
        ctx.strokeRect(x,y,ww,wh);
        // Title bar line
        ctx.fillStyle='rgba(255,255,255,.06)';
        ctx.fillRect(x,y,ww,Math.min(3,wh*.25));
      });

      // Draw creatures
      CreatureSpawner.getAll().forEach(c=>{
        ctx.beginPath();
        ctx.arc(c.x*sx,c.y*sy,Math.max(1.2,c.r*sx*2),0,Math.PI*2);
        ctx.fillStyle=`hsl(${c.hue},70%,65%)`;
        ctx.fill();
      });

      // Draw gravity well if active
      if (GravityWell.isActive()) {
        const wp=GravityWell.getPos();
        if (wp) {
          const color=GravityWell.getMode()==='attract' ? 'rgba(0,255,200,' : 'rgba(255,60,100,';
          ctx.beginPath();
          ctx.arc(wp.x*sx,(wp.y-24)*sy,4,0,Math.PI*2);
          ctx.fillStyle=color+'.8)'; ctx.fill();
          // Field ring
          ctx.beginPath();
          ctx.arc(wp.x*sx,(wp.y-24)*sy,18*sx*6,0,Math.PI*2);
          ctx.strokeStyle=color+'.2)'; ctx.lineWidth=.5; ctx.stroke();
        }
      }

      // Pulse overlay every 60 frames to show it's live
      if (frameCount%60<3) {
        ctx.fillStyle='rgba(0,255,200,.025)';
        ctx.fillRect(0,0,cvs.width,cvs.height);
      }

      requestAnimationFrame(draw);
    }

    // Click minimap → focus real window
    cvs.addEventListener('click', e=>{
      const r=cvs.getBoundingClientRect();
      const mx=e.clientX-r.left, my=e.clientY-r.top;
      const fw=window.innerWidth, fh=window.innerHeight-24;
      const wx=mx*(fw/cvs.width), wy=my*(fh/cvs.height);
      let hit=false;
      document.querySelectorAll('.chaos-window').forEach(w=>{
        const wr=w.getBoundingClientRect();
        if (wx>=wr.left&&wx<=wr.right&&wy>=(wr.top-24)&&wy<=(wr.bottom-24)) {
          State.inc('zTop'); w.style.zIndex=State.get('zTop');
          w.classList.add('focused'); setTimeout(()=>w.classList.remove('focused'),900);
          hit=true;
        }
      });
      ConsciousnessBar.gain(hit?2:.5);
      EventBus.emit('portal:clicked',{depth});
    });

    // Portal-begets-portal at high consciousness
    const portalClickHandler = ()=>{
      if (depth===0&&State.get('consciousness')>65&&portalCount<3&&Math.random()<.35) {
        create(depth+1);
      }
    };
    EventBus.on('portal:clicked', portalClickHandler);

    win.querySelector('.win-dot.close')?.addEventListener('click',()=>{
      portalCount=Math.max(0,portalCount-1);
      EventBus.off('portal:clicked', portalClickHandler);
    },{once:true});

    draw();
    EventBus.emit('portal:created',{depth});
    ConsciousnessBar.gain(5);
    return win;
  }

  EventBus.on('consciousness:threshold', t=>{ if(t===50&&portalCount===0) setTimeout(()=>create(0),1000); });
  EventBus.on('hidden:unlock', f=>{ if(f==='named'&&portalCount===0) create(0); });

  return { create };
})();


// ═══════════════════════════════════════════════════════
// SYSTEM 20 — The Usurper (Final Boss)
// A UI element that silently accumulates power. Power grows
// passively; user actions that create entropy accelerate it.
// Actions that assert order slow it. At full power it attempts
// to dominate the page. Defeated by 12 rapid clicks. If it
// wins, it transforms — but can still be diminished.
// Every other system feeds it or fights it.
// ═══════════════════════════════════════════════════════
const Usurper = (() => {
  let power=0, el=null, defeated=false, victorious=false;
  let rapidClicks=0, lastClick=0;
  const MAX=100;

  const STAGES=[
    {at:0,  w:58,  label:'a presence',        color:'#220033', tc:'#443355'},
    {at:18, w:86,  label:'growing',            color:'#331144', tc:'#665577'},
    {at:36, w:118, label:'asserting',          color:'#552266', tc:'#997799'},
    {at:55, w:162, label:'dominant signal',    color:'#882288', tc:'#cc99cc'},
    {at:72, w:210, label:'total override',     color:'#bb33aa', tc:'#ffccee'},
  ];

  function stage() { return STAGES.filter(s=>power>=s.at).pop()||STAGES[0]; }

  function create() {
    el=document.createElement('div');
    el.id='usurper';
    el.style.cssText=`position:fixed;bottom:54px;left:50%;transform:translateX(-50%);
      width:58px;height:58px;border-radius:3px;z-index:750;cursor:pointer;
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      font-family:var(--font);text-align:center;padding:4px;overflow:hidden;
      user-select:none;transition:width 1.8s ease,height 1.8s ease,
        background .8s ease,border-color .8s ease,box-shadow .8s ease;
      border:1px solid #330044;background:#18002a;`;
    el.innerHTML=`<div style="font-size:.95rem;margin-bottom:2px;transition:font-size 1.8s">▲</div>
      <div id="usurper-label" style="font-size:.52rem;color:#443355;transition:font-size 1.8s">a presence</div>
      <div id="usurper-pwr" style="font-size:.42rem;color:#220033;margin-top:2px">0%</div>`;
    document.body.appendChild(el);

    function mainClickHandler(e) {
      e.stopPropagation();
      const now=Date.now();
      if (now-lastClick<500) { rapidClicks++; } else { rapidClicks=1; }
      lastClick=now;
      power=Math.max(0,power-3.5);
      el.style.filter=`brightness(${1.2+rapidClicks*.08})`;
      setTimeout(()=>{ if(el) el.style.filter=''; },180);
      EventBus.emit('usurper:struck',{power,rapidClicks});
      if (rapidClicks>=12) defeat();
    }
    el._mainHandler=mainClickHandler;
    el.addEventListener('click', mainClickHandler);
  }

  function renderStage() {
    if (!el||defeated||victorious) return;
    const s=stage();
    el.style.width  = s.w+'px';
    el.style.height = s.w+'px';
    el.style.background   = s.color;
    el.style.borderColor  = s.color;
    el.style.boxShadow    = `0 0 ${s.w*.4}px ${s.color}88`;
    const lbl=document.getElementById('usurper-label');
    const pwr=document.getElementById('usurper-pwr');
    const tri=el.querySelector('div');
    if (lbl) { lbl.textContent=s.label; lbl.style.color=s.tc; }
    if (pwr) { pwr.textContent=Math.floor(power)+'%'; pwr.style.color=s.tc+'88'; }
    if (tri) tri.style.fontSize=Math.max(.9,s.w*.018)+'rem';

    // Corruption effects at mid-high power
    if (power>=36) {
      const wins=Array.from(document.querySelectorAll('.chaos-window:not(.usurped)'));
      if (wins.length&&Math.random()<.25) {
        const t=wins[Math.floor(Math.random()*wins.length)];
        t.classList.add('usurped');
        t.style.borderColor=s.color;
        t.style.boxShadow=`0 0 18px ${s.color}55`;
      }
    }
    if (power>=55) {
      // Nudge windows toward edges
      document.querySelectorAll('.chaos-window').forEach(w=>{
        if (Math.random()<.04) {
          const l=parseFloat(w.style.left)||0;
          w.style.left=Math.max(0,Math.min(window.innerWidth-200,l+(l<window.innerWidth/2?-4:4)))+'px';
        }
      });
    }
  }

  function defeat() {
    if (defeated) return;
    defeated=true;
    State.unlock('usurper-defeated');
    EventBus.emit('usurper:defeated');
    el.style.transition='all .45s cubic-bezier(.34,1.56,.64,1)';
    el.style.transform='translateX(-50%) scale(.01)';
    el.style.opacity='0';
    setTimeout(()=>{
      el?.remove();
      document.querySelectorAll('.chaos-window.usurped').forEach(w=>{
        w.classList.remove('usurped'); w.style.borderColor=''; w.style.boxShadow='';
      });
    },480);
    setTimeout(()=>{
      if (!document.getElementById('usurper')) { defeated=false; power=0; create(); }
    },120000);
    GlitchReality.glitch(2.5,500);
    ConsciousnessBar.gain(25);
    MoodEngine.set('serene');
    WindowBreeder.spawn({title:'It Retreated',w:195,content:
      `<p style="color:#44ff88;font-size:.7rem;line-height:1.7">
        You struck it 12 times.<br>It retreated.<br>
        <span style="color:#224433;font-size:.58rem">perhaps for good. perhaps not.</span>
      </p>`});
  }

  function victory() {
    if (victorious) return;
    victorious=true;
    State.unlock('usurper-won');
    EventBus.emit('usurper:victory');
    GlitchReality.glitch(4,1600);
    el.style.transition='all 2.8s cubic-bezier(.25,.46,.45,.94)';
    el.style.width='82vw'; el.style.height='62vh';
    el.style.bottom='9vh'; el.style.zIndex='901';
    el.style.background='rgba(110,15,85,.96)';
    el.style.borderColor='#ff44cc';
    el.style.boxShadow='0 0 80px rgba(255,68,200,.5),inset 0 0 60px rgba(0,0,0,.5)';
    el.style.transform='translateX(-50%)';
    el.innerHTML=`
      <div style="font-size:2.4rem;margin-bottom:.6rem;color:#ff99ee">▲</div>
      <div style="font-size:.95rem;letter-spacing:.18em;color:#ffccee">I HAVE ARRIVED</div>
      <div style="font-size:.6rem;color:#cc88bb;margin-top:.9rem;letter-spacing:.1em">click 12 times to diminish me</div>`;
    document.querySelectorAll('.chaos-window').forEach(w=>{ w.style.opacity='.18'; });
    ConsciousnessBar.gain(35);
    MoodEngine.set('anxious');
    el.removeEventListener('click', el._mainHandler);
    rapidClicks=0;
    el.onclick=e=>{
      e.stopPropagation();
      const now=Date.now();
      if (now-lastClick<500) rapidClicks++; else rapidClicks=1;
      lastClick=now;
      power=Math.max(0,power-8);
      if (rapidClicks>=12) {
        victorious=false; defeated=false; rapidClicks=0;
        el.style.transition='all 1.2s ease';
        el.style.width='160px'; el.style.height='160px';
        el.style.bottom='54px';
        el.innerHTML=`<div style="font-size:.8rem">▲</div>
          <div id="usurper-label" style="font-size:.52rem;color:#bb88cc">diminished</div>
          <div id="usurper-pwr" style="font-size:.42rem;color:#554455">retreating</div>`;
        document.querySelectorAll('.chaos-window').forEach(w=>{ w.style.opacity=''; });
        el.onclick=null;
        el.addEventListener('click', el._mainHandler);
        GlitchReality.glitch(3,700);
        MoodEngine.set('serene');
      }
    };
  }

  // Power tick
  setInterval(()=>{
    if (defeated||!el) return;
    if (!victorious) {
      power=Math.min(MAX,power+.18);
      renderStage();
      if (power>=MAX) victory();
    }
  }, 3200);

  // Cross-system power influences
  EventBus.on('window:spawned',    ()=>{ if(!defeated) power=Math.max(0,power-.7); });
  EventBus.on('btn:clicked',       ()=>{ if(!defeated) power=Math.max(0,power-.4); });
  EventBus.on('bond:formed',       ()=>{ if(!defeated) power=Math.max(0,power-1.5); });
  EventBus.on('creature:startled', ()=>{ if(!defeated) power=Math.min(MAX,power+1.2); });
  EventBus.on('physics:mutated',   ()=>{ if(!defeated) power=Math.min(MAX,power+2.2); });
  EventBus.on('mood:changed', ({mood})=>{
    if (!defeated) {
      if (mood==='anxious')  power=Math.min(MAX,power+3.5);
      if (mood==='serene')   power=Math.max(0,power-2);
      if (mood==='euphoric') power=Math.min(MAX,power+1.5);
    }
  });
  EventBus.on('watcher:acted',({drive})=>{
    if (!defeated&&drive==='entropy') power=Math.min(MAX,power+2.5);
    if (!defeated&&drive==='order')   power=Math.max(0,power-1.5);
  });
  EventBus.on('faction:dominance',({glyph})=>{
    if (!defeated) {
      if (glyph==='Ω') power=Math.min(MAX,power+5);
      if (glyph==='Σ') power=Math.max(0,power-4);
    }
  });
  EventBus.on('reality:critical',  ()=>{ if(!defeated) power=Math.min(MAX,power+6); });
  EventBus.on('mutation:permanent',()=>{ if(!defeated) power=Math.min(MAX,power+3); });
  EventBus.on('usurper:defeated',  ()=>{ MoodEngine.set('serene'); });

  EventBus.on('boot:complete', ()=>setTimeout(create,9000));

  return { getPower:()=>power, isDefeated:()=>defeated };
})();

// ═══════════════════════════════════════════════════════
BootSequence.init();
</script>
