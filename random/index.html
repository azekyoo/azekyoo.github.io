<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beautiful Chaos Machine</title>
<style>
:root {
  --bg: #080012;
  --fg: #d8c8ff;
  --pink: #ff4da6;
  --cyan: #00ffe5;
  --gold: #ffd700;
  --purple: #9933ff;
  --win-bg: rgba(10, 0, 24, 0.97);
  --win-border: #6622cc;
  --win-title-bg: #14003a;
  --font: 'Courier New', monospace;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font);
  min-height: 100vh;
  overflow: hidden;
  position: relative;
}

/* CRT scanlines */
body::after {
  content: '';
  position: fixed;
  inset: 0;
  background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.04) 2px, rgba(0,0,0,0.04) 4px);
  pointer-events: none;
  z-index: 9990;
}

/* Starfield */
#starfield {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
}

/* ── BOOT SCREEN ── */
#boot-screen {
  position: fixed;
  inset: 0;
  background: #000;
  z-index: 9999;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 0;
}
#boot-screen.fade-out { animation: boot-fade 1s forwards; }

.boot-logo {
  font-size: 2.2rem;
  color: var(--cyan);
  text-shadow: 0 0 30px var(--cyan), 0 0 60px var(--cyan);
  margin-bottom: 2rem;
  letter-spacing: 0.3em;
  animation: flicker 4s infinite;
}
.boot-sub {
  font-size: 0.65rem;
  color: #664488;
  letter-spacing: 0.5em;
  margin-bottom: 2rem;
}
#boot-log {
  width: 520px;
  max-width: 90vw;
  font-size: 0.72rem;
  color: #66ff88;
  height: 160px;
  overflow: hidden;
  border: 1px solid #1a3a1a;
  padding: 8px 10px;
  background: rgba(0,255,100,0.02);
  line-height: 1.6;
}
#boot-log div { animation: slide-in 0.08s ease; }
.boot-bar-wrap {
  width: 520px;
  max-width: 90vw;
  margin-top: 12px;
  height: 4px;
  background: #111;
  border: 1px solid #222;
}
#boot-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--purple), var(--cyan), var(--pink));
  width: 0%;
  transition: width 0.15s linear;
  box-shadow: 0 0 12px var(--cyan);
}
.boot-status {
  margin-top: 10px;
  font-size: 0.6rem;
  color: #443355;
  letter-spacing: 0.2em;
}

/* ── CONSCIOUSNESS BAR ── */
#cbar {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: 24px;
  background: rgba(0,0,0,0.85);
  border-bottom: 1px solid #330055;
  z-index: 1000;
  display: flex;
  align-items: center;
  padding: 0 10px;
  gap: 8px;
  font-size: 0.62rem;
}
#cbar-label { color: var(--pink); white-space: nowrap; flex-shrink: 0; }
#cbar-track {
  flex: 1;
  height: 8px;
  background: #12001a;
  border: 1px solid #440044;
  overflow: hidden;
  border-radius: 1px;
}
#cbar-fill {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, #6600cc, var(--pink), var(--gold));
  transition: width 0.6s cubic-bezier(0.25,0.46,0.45,0.94);
  box-shadow: 0 0 10px var(--pink);
}
#cbar-pct { color: var(--gold); width: 30px; text-align: right; flex-shrink: 0; }
#cbar-status { color: #664466; flex-shrink: 0; font-size: 0.58rem; max-width: 200px; overflow: hidden; white-space: nowrap; }

/* ── CHAOS FIELD ── */
#chaos-field {
  position: fixed;
  inset: 24px 0 0 0;
  overflow: hidden;
}

/* ── WINDOWS ── */
.chaos-window {
  position: absolute;
  min-width: 180px;
  min-height: 80px;
  background: var(--win-bg);
  border: 1px solid var(--win-border);
  box-shadow: 0 4px 40px rgba(80,0,160,0.35), inset 0 0 40px rgba(0,0,0,0.4);
  border-radius: 2px;
  user-select: none;
  transition: box-shadow 0.3s;
}
.chaos-window.focused {
  border-color: var(--cyan);
  box-shadow: 0 4px 40px rgba(0,200,200,0.35), inset 0 0 40px rgba(0,0,0,0.4);
}
.win-titlebar {
  background: var(--win-title-bg);
  padding: 5px 8px;
  display: flex;
  align-items: center;
  gap: 5px;
  cursor: move;
  border-bottom: 1px solid var(--win-border);
  min-height: 26px;
}
.win-dot {
  width: 10px; height: 10px;
  border-radius: 50%;
  cursor: pointer;
  flex-shrink: 0;
  transition: transform 0.15s, filter 0.15s;
}
.win-dot:hover { transform: scale(1.3); filter: brightness(1.4); }
.win-dot.close { background: #cc3333; }
.win-dot.min   { background: #cc9900; }
.win-dot.breed { background: #33aa44; }
.win-title-text {
  flex: 1;
  font-size: 0.68rem;
  color: #998abb;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.win-body {
  padding: 12px;
  font-size: 0.73rem;
  line-height: 1.5;
  min-height: 60px;
}
.win-body p { margin-bottom: 6px; }

/* ── BUTTONS ── */
.chaos-btn {
  border: 1px solid var(--purple);
  background: transparent;
  color: var(--fg);
  font-family: var(--font);
  font-size: 0.72rem;
  padding: 5px 12px;
  cursor: pointer;
  position: relative;
  transition: background 0.2s, color 0.2s, border-color 0.2s;
  white-space: nowrap;
}
.chaos-btn:hover { background: rgba(153,51,255,0.15); }

/* Personality tags */
.p-tag {
  position: absolute;
  top: -13px;
  left: 0;
  font-size: 0.52rem;
  color: #664488;
  pointer-events: none;
  white-space: nowrap;
}

/* ── ANIMATIONS ── */
@keyframes flicker {
  0%,91%,95%,100% { opacity: 1; }
  92%,94% { opacity: 0.15; }
  93% { opacity: 0.8; }
}
@keyframes slide-in {
  from { opacity: 0; transform: translateX(-6px); }
  to   { opacity: 1; transform: translateX(0); }
}
@keyframes boot-fade {
  to { opacity: 0; pointer-events: none; }
}
@keyframes win-enter {
  from { opacity: 0; transform: scale(0.6) translateY(10px); }
  to   { opacity: 1; transform: scale(1) translateY(0); }
}
@keyframes win-exit {
  to { opacity: 0; transform: scale(0.5) translateY(-10px); }
}
@keyframes paranoid {
  0%,100% { transform: translate(0,0) rotate(0deg); }
  20% { transform: translate(-1px,1px) rotate(-0.3deg); }
  40% { transform: translate(1px,-1px) rotate(0.2deg); }
  60% { transform: translate(-1px,-1px) rotate(0.3deg); }
  80% { transform: translate(1px,1px) rotate(-0.2deg); }
}
@keyframes pulse-border {
  0%,100% { border-color: var(--purple); }
  50%  { border-color: var(--pink); }
}
@keyframes glitch-body {
  0%,100% { filter:none; transform:translate(0,0); }
  12% { filter:hue-rotate(90deg) saturate(3); transform:translate(2px,0); }
  28% { filter:invert(0.1) hue-rotate(-30deg); transform:translate(-2px,1px); }
  48% { filter:saturate(0.08) brightness(1.9); transform:translate(0,-1px); }
  66% { filter:hue-rotate(180deg) contrast(1.6); transform:translate(3px,0); }
  84% { filter:saturate(5) hue-rotate(45deg); transform:translate(-1px,2px); }
}
</style>
</head>
<body>

<canvas id="starfield"></canvas>

<!-- BOOT SCREEN -->
<div id="boot-screen">
  <div class="boot-logo">✦ CHAOS MACHINE ✦</div>
  <div class="boot-sub">BEAUTIFUL SYSTEMS OF INTENTIONAL DYSFUNCTION</div>
  <div id="boot-log"></div>
  <div class="boot-bar-wrap"><div id="boot-bar"></div></div>
  <div class="boot-status" id="boot-status">INITIALIZING...</div>
</div>

<!-- CONSCIOUSNESS BAR -->
<div id="cbar">
  <span id="cbar-label">CONSCIOUSNESS:</span>
  <div id="cbar-track"><div id="cbar-fill"></div></div>
  <span id="cbar-pct">0%</span>
  <span id="cbar-status"></span>
</div>

<!-- MAIN FIELD -->
<div id="chaos-field"></div>

<script>
'use strict';

// ═══════════════════════════════════════════════════════
// CORE — EventBus
// ═══════════════════════════════════════════════════════
const EventBus = (() => {
  const _l = {};
  return {
    on(e, fn)   { (_l[e] = _l[e] || []).push(fn); return () => EventBus.off(e, fn); },
    off(e, fn)  { if (_l[e]) _l[e] = _l[e].filter(f => f !== fn); },
    emit(e, d)  { (_l[e] || []).slice().forEach(fn => { try { fn(d); } catch(ex) { console.warn('EventBus error in', e, ex); } }); },
  };
})();

// ═══════════════════════════════════════════════════════
// CORE — StateManager
// ═══════════════════════════════════════════════════════
const State = (() => {
  const s = {
    consciousness: 0,
    windowCount: 0,
    totalClicks: 0,
    mood: 'neutral',
    bootDone: false,
    zTop: 100,
    hiddenStates: new Set(),
  };
  return {
    get: k => s[k],
    set(k, v) { s[k] = v; EventBus.emit('state:change', { k, v }); },
    inc(k, n = 1) { this.set(k, (s[k] || 0) + n); },
    unlock(flag) {
      if (s.hiddenStates.has(flag)) return false;
      s.hiddenStates.add(flag);
      EventBus.emit('hidden:unlock', flag);
      return true;
    },
    hasUnlocked: flag => s.hiddenStates.has(flag),
  };
})();

// ═══════════════════════════════════════════════════════
// CORE — Drag system (shared, prevents listener leaks)
// ═══════════════════════════════════════════════════════
const Drag = (() => {
  let active = null;
  document.addEventListener('mousemove', e => {
    if (!active) return;
    active.el.style.left = Math.max(0, e.clientX - active.ox) + 'px';
    active.el.style.top  = Math.max(24, e.clientY - active.oy) + 'px';
  });
  document.addEventListener('mouseup', () => { active = null; });
  return {
    bind(el, handle) {
      handle.addEventListener('mousedown', e => {
        e.preventDefault();
        active = { el, ox: e.clientX - el.offsetLeft, oy: e.clientY - el.offsetTop };
        State.inc('zTop');
        el.style.zIndex = State.get('zTop');
        el.dispatchEvent(new CustomEvent('drag-start'));
      });
    }
  };
})();

// ═══════════════════════════════════════════════════════
// SYSTEM 1 — Starfield (background ambience)
// ═══════════════════════════════════════════════════════
const Starfield = (() => {
  const canvas = document.getElementById('starfield');
  const ctx = canvas.getContext('2d');
  let stars = [];

  function resize() {
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;
    stars = Array.from({ length: 140 }, () => ({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      r: Math.random() * 1.2 + 0.2,
      s: Math.random() * 0.5 + 0.1,
      phase: Math.random() * Math.PI * 2,
    }));
  }

  let frame = 0;
  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    frame++;
    stars.forEach(st => {
      const alpha = 0.3 + 0.4 * Math.sin(frame * st.s * 0.04 + st.phase);
      ctx.beginPath();
      ctx.arc(st.x, st.y, st.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(200,180,255,${alpha.toFixed(2)})`;
      ctx.fill();
    });
    requestAnimationFrame(draw);
  }

  window.addEventListener('resize', resize);
  resize();
  draw();
})();

// ═══════════════════════════════════════════════════════
// SYSTEM 2 — BootSequence
// ═══════════════════════════════════════════════════════
const BootSequence = (() => {
  const MSGS = [
    'INITIALIZING CHAOS SUBSTRATE............OK',
    'LOADING PERSONALITY MATRICES [████████].OK',
    'ALLOCATING DREAM MEMORY: 2.7TB............',
    'WARNING: PHYSICS MODULE REPORTS ANOMALIES',
    '  > GRAVITY CONSTANT DRIFTING: acceptable',
    'SPAWNING CONSCIOUSNESS THREAD.............OK',
    'MOUNTING /dev/strange.........................',
    'SEEDING ENTROPY POOLS [████████]..........OK',
    'LOADING CREATURE DEFINITIONS: 47 entities',
    'REALITY COHERENCE CHECK..................FAIL',
    '  > proceeding anyway (this is fine)',
    'BEAUTIFUL CHAOS MACHINE v∞.∞.∞ — READY',
  ];

  const bootLog    = document.getElementById('boot-log');
  const bootBar    = document.getElementById('boot-bar');
  const bootScreen = document.getElementById('boot-screen');
  const bootStatus = document.getElementById('boot-status');

  let idx = 0;

  function addLine(text) {
    const d = document.createElement('div');
    d.textContent = text;
    bootLog.appendChild(d);
    bootLog.scrollTop = bootLog.scrollHeight;
  }

  function tick() {
    if (idx >= MSGS.length) { setTimeout(finish, 500); return; }
    addLine(MSGS[idx]);
    const pct = Math.round((idx + 1) / MSGS.length * 100);
    bootBar.style.width = pct + '%';
    bootStatus.textContent = pct + '% COMPLETE';
    idx++;
    setTimeout(tick, 150 + Math.random() * 280);
  }

  function finish() {
    bootScreen.classList.add('fade-out');
    setTimeout(() => {
      bootScreen.remove();
      State.set('bootDone', true);
      EventBus.emit('boot:complete');
    }, 1000);
  }

  return { init() { setTimeout(tick, 700); } };
})();

// ═══════════════════════════════════════════════════════
// SYSTEM 3 — ConsciousnessBar
// ═══════════════════════════════════════════════════════
const ConsciousnessBar = (() => {
  const fill   = document.getElementById('cbar-fill');
  const pctEl  = document.getElementById('cbar-pct');
  const status = document.getElementById('cbar-status');

  const THRESH = [10, 25, 50, 75, 90, 100];
  const LABELS = {
    10: 'it notices you',
    25: 'it remembers you',
    50: 'it has opinions',
    75: 'it wants things',
    90: 'it is almost real',
    100: 'it is awake',
  };
  const triggered = new Set();

  function update(val) {
    const v = Math.min(100, Math.max(0, val));
    fill.style.width = v + '%';
    pctEl.textContent = Math.floor(v) + '%';
    THRESH.forEach(t => {
      if (v >= t && !triggered.has(t)) {
        triggered.add(t);
        status.textContent = LABELS[t] || '';
        EventBus.emit('consciousness:threshold', t);
      }
    });
  }

  function gain(n) {
    const next = Math.min(100, (State.get('consciousness') || 0) + n);
    State.set('consciousness', next);
    update(next);
  }

  EventBus.on('window:spawned',  () => gain(2.0));
  EventBus.on('window:bred',     () => gain(3.5));
  EventBus.on('btn:clicked',     () => gain(0.6));
  EventBus.on('hidden:unlock',   () => gain(6.0));

  let moveTimer = 0;
  document.addEventListener('mousemove', () => {
    const now = Date.now();
    if (now - moveTimer > 3000) { gain(0.08); moveTimer = now; }
  });

  return { gain };
})();

// ═══════════════════════════════════════════════════════
// SYSTEM 4 — WindowBreeder
// ═══════════════════════════════════════════════════════
const WindowBreeder = (() => {
  const field = document.getElementById('chaos-field');
  const MAX_WINDOWS = 32;

  function focus(win) {
    field.querySelectorAll('.chaos-window').forEach(w => w.classList.remove('focused'));
    win.classList.add('focused');
    State.inc('zTop');
    win.style.zIndex = State.get('zTop');
  }

  function spawn(opts = {}) {
    if (State.get('windowCount') >= MAX_WINDOWS) {
      EventBus.emit('window:overflow');
      return null;
    }

    const win = document.createElement('div');
    win.className = 'chaos-window';
    win.style.cssText = [
      `left:${opts.x !== undefined ? opts.x : 60 + Math.random() * Math.max(0, window.innerWidth  - 300)}px`,
      `top:${opts.y  !== undefined ? opts.y : 40 + Math.random() * Math.max(0, window.innerHeight - 250)}px`,
      `width:${opts.w || (200 + Math.random() * 160)}px`,
      `z-index:${State.inc('zTop'), State.get('zTop')}`,
      'animation:win-enter 0.35s cubic-bezier(0.34,1.56,0.64,1) both',
    ].join(';');

    const id    = 'w' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
    const title = opts.title || rndTitle();
    win.id = id;

    win.innerHTML = `
      <div class="win-titlebar">
        <div class="win-dot close"  title="Close"></div>
        <div class="win-dot min"    title="Minimize"></div>
        <div class="win-dot breed"  title="Breed"></div>
        <span class="win-title-text">${escHtml(title)}</span>
      </div>
      <div class="win-body">${opts.content || defaultBody(State.get('windowCount') + 1)}</div>
    `;

    field.appendChild(win);

    const titlebar = win.querySelector('.win-titlebar');
    Drag.bind(win, titlebar);

    win.addEventListener('mousedown', () => focus(win));

    win.querySelector('.win-dot.close').addEventListener('click', e => {
      e.stopPropagation();
      win.style.animation = 'win-exit 0.25s ease forwards';
      setTimeout(() => { win.remove(); State.inc('windowCount', -1); }, 260);
    });

    win.querySelector('.win-dot.breed').addEventListener('click', e => {
      e.stopPropagation();
      const rect = win.getBoundingClientRect();
      const child = spawn({
        x: rect.left + 24,
        y: rect.top + 24,
        title: childTitle(title),
        content: childBody(title),
      });
      if (child) EventBus.emit('window:bred', { parentId: id, childId: child.id });
    });

    State.inc('windowCount', 1);
    EventBus.emit('window:spawned', { id, title, el: win });
    return win;
  }

  const ADJ  = ['Haunted','Recursive','Suspicious','Liminal','Emergent','Volatile','Hollow','Drifting'];
  const NOUN = ['Process','Instance','Fragment','Specter','Module','Entity','Vessel','Loop'];
  const rndOf = arr => arr[Math.floor(Math.random() * arr.length)];
  const rndTitle  = () => rndOf(ADJ) + ' ' + rndOf(NOUN);
  const childTitle = t => t.split('(')[0].trim() + ' (offspring)';
  const escHtml = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

  function defaultBody(n) {
    return `<p style="color:#776699;margin-bottom:8px">Window #${n}</p>
<p style="font-size:0.65rem;color:#554477;line-height:1.6">
  Click <span style="color:#33aa44">&#11044;</span> to breed a child window.<br>
  Children inherit parenthetical guilt.
</p>`;
  }

  function childBody(parentTitle) {
    const msgs = [
      `I emerged from <em style="color:var(--cyan)">"${escHtml(parentTitle)}"</em>.<br>I am already different.`,
      `My parent closed before I was ready.<br>I carry that.`,
      `Born confused. Still watching.`,
      `I contain a smaller version of what you think I am.`,
    ];
    return `<p style="font-size:0.7rem;color:#bb88ee;line-height:1.6">${msgs[Math.floor(Math.random() * msgs.length)]}</p>`;
  }

  EventBus.on('boot:complete', () => {
    setTimeout(() => spawn({
      x: 40, y: 40,
      title: 'Welcome to the Machine',
      content: `<p style="color:var(--cyan);margin-bottom:8px">Hello.</p>
<p style="font-size:0.65rem;color:#998acc;line-height:1.7">
  This interface is alive.<br>
  Interact carefully.<br>
  Or don't. It watches either way.<br><br>
  <span style="color:#664466;font-size:0.6rem">consciousness rises with interaction</span>
</p>`,
    }), 600);

    setTimeout(() => spawn({
      x: window.innerWidth - 300, y: 50,
      title: 'Personality Lab',
      content: `<p style="font-size:0.62rem;color:#776699;margin-bottom:10px">These buttons have feelings. Give them time.</p>
<div id="plab-btns" style="display:flex;flex-wrap:wrap;gap:8px;row-gap:16px;padding-top:4px"></div>`,
    }), 1400);
  });

  return { spawn };
})();

// ═══════════════════════════════════════════════════════
// SYSTEM 5 — PersonalityEngine
// ═══════════════════════════════════════════════════════
const PersonalityEngine = (() => {
  const PERSONALITIES = {
    shy: {
      tag: 'shy',
      color: '#8866aa',
      install(btn) {
        // Button moves away from cursor
        document.addEventListener('mousemove', function handler(e) {
          if (!btn.isConnected) { document.removeEventListener('mousemove', handler); return; }
          const r = btn.getBoundingClientRect();
          const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
          const dx = e.clientX - cx,       dy = e.clientY - cy;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < 90) {
            const force = (90 - dist) / 45;
            btn.style.transform = `translate(${-dx * force * 0.6}px, ${-dy * force * 0.6}px)`;
          } else {
            btn.style.transform = '';
          }
        });
        btn.style.transition = 'transform 0.1s ease';
      }
    },
    aggressive: {
      tag: '!',
      color: '#ff4488',
      install(btn) {
        btn.addEventListener('mouseenter', () => {
          btn.style.transform = 'scale(1.18)';
          btn.style.borderColor = 'var(--pink)';
          btn.style.color = 'var(--pink)';
          btn.style.zIndex = '999';
          btn.style.boxShadow = '0 0 12px var(--pink)';
        });
        btn.addEventListener('mouseleave', () => {
          btn.style.transform = '';
          btn.style.borderColor = '';
          btn.style.color = '';
          btn.style.zIndex = '';
          btn.style.boxShadow = '';
        });
        btn.style.transition = 'all 0.12s ease';
      }
    },
    flirty: {
      tag: '~',
      color: '#ff88cc',
      install(btn) {
        const orig = btn.dataset.origLabel;
        const msgs = ['click me~', 'are you sure?', 'maybe...', '✦', 'please?', '...hi'];
        btn.addEventListener('mouseenter', () => {
          const ptag = btn.querySelector('.p-tag');
          btn.textContent = msgs[Math.floor(Math.random() * msgs.length)];
          if (ptag) btn.appendChild(ptag);
          btn.style.animation = 'pulse-border 1s infinite';
        });
        btn.addEventListener('mouseleave', () => {

          btn.textContent = orig;
          if (ptag) btn.appendChild(ptag);
          btn.style.animation = '';
        });
        btn.style.borderStyle = 'dashed';
      }

    paranoid: {
      tag: '?!',
      color: '#ffcc00',
      install(btn) {
        btn.style.animation = 'paranoid 0.6s infinite';
        btn.title = "I know what you're about to do.";
        let clicks = 0;

        btn.addEventListener('click', () => {
          clicks++;

          if (clicks === 3) { btn.textContent = 'STOP'; if (ptag) btn.appendChild(ptag); }
          if (clicks === 5) { btn.textContent = 'WHY';  if (ptag) btn.appendChild(ptag); }

            btn.textContent = orig;
            if (ptag) btn.appendChild(ptag);
            clicks = 0;
            btn.title = "Fine. Fine! I forgive you.";
          }
        });
      }
    },
    zen: {
      tag: ' ',
      color: '#aaccff',
      install(btn) {
        btn.style.opacity = '0.25';

          btn.style.opacity = '1';

        });
        btn.addEventListener('mouseleave', () => {
          btn.style.transform = '';
          setTimeout(() => { btn.style.opacity = '0.25'; }, 1500);
        });
      }
    },
    melancholic: {
      tag: '...',
      color: '#6688bb',
      install(btn) {
        const orig = btn.dataset.origLabel;
        btn.addEventListener('click', () => {
          const ptag = btn.querySelector('.p-tag');
          btn.textContent = '...';
          if (ptag) btn.appendChild(ptag);
          setTimeout(() => {
            const ptag2 = btn.querySelector('.p-tag');
            btn.textContent = orig;
            if (ptag2) btn.appendChild(ptag2);
          }, 2000);
        });
        btn.style.color = '#6688bb';
        btn.style.borderColor = '#334466';
      }
    },
  };

  const PNAMES = Object.keys(PERSONALITIES);

  function assign(btn) {
    const key = PNAMES[Math.floor(Math.random() * PNAMES.length)];
    const p   = PERSONALITIES[key];
    btn.dataset.personality = key;

    btn.dataset.origLabel = btn.textContent;
    const tag = document.createElement('span');
    tag.className = 'p-tag';
    tag.textContent = `[${p.tag}]`;
    tag.style.color = p.color;
    btn.appendChild(tag);

    p.install(btn);
    EventBus.emit('personality:assigned', { btn, key });
  }

  // Wire up the Personality Lab panel when it appears
  EventBus.on('window:spawned', ({ el }) => {
    const container = el.querySelector('#plab-btns');
    if (!container) return;

    const labels = ['OK', 'Cancel', 'Submit', 'Yes', 'No', 'Maybe', 'Continue', 'Escape', 'Help', 'Why'];
    labels.forEach((label, i) => {
      const btn = document.createElement('button');
      btn.className = 'chaos-btn';
      btn.textContent = label;
      btn.addEventListener('click', () => {
        State.inc('totalClicks', 1);
        EventBus.emit('btn:clicked', { label, personality: btn.dataset.personality });
      });
      container.appendChild(btn);
      // Personalities develop over time, not instantly
      setTimeout(() => assign(btn), 1000 + i * 500 + Math.random() * 400);
    });
  });

  return { assign, PERSONALITIES };
})();

// PHASE 2 — Six New Chaos Systems
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

// ═══════════════════════════════════════════════════════
// SYSTEM 6 — PhysicsMutator
// Mutates global physics constants every 30-90s.
// Announces changes via EventBus so every physics-aware
// system reacts without polling.
// ═══════════════════════════════════════════════════════
const PhysicsMutator = (() => {
  const phys = { gravity:0, friction:0.97, chaos:1, windX:0 };
  const MUTATIONS = [
    { label:'gravity surge',  apply: p=>{ p.gravity=0.45; p.friction=0.94; }},
    { label:'zero gravity',   apply: p=>{ p.gravity=-0.06; p.friction=0.999; }},
    { label:'high entropy',   apply: p=>{ p.chaos=2.8; p.windX=(Math.random()-.5)*.9; }},
    { label:'viscous medium', apply: p=>{ p.friction=0.86; p.chaos=0.3; }},
    { label:'lateral wind',   apply: p=>{ p.windX=(Math.random()-.5)*1.5; }},
    { label:'stable',         apply: p=>{ p.gravity=0; p.friction=0.97; p.chaos=1; p.windX=0; }},
  ];

  function mutate() {
    const m = MUTATIONS[Math.floor(Math.random()*MUTATIONS.length)];
    m.apply(phys);
    phys.gravity  = Math.max(-0.3,  Math.min(0.8,   phys.gravity));
    phys.friction = Math.max(0.82,  Math.min(0.999, phys.friction));
    phys.chaos    = Math.max(0.2,   Math.min(4,     phys.chaos));
    EventBus.emit('physics:mutated', { ...phys, label: m.label });

    if (Math.random() < 0.45) {
      const win = WindowBreeder.spawn({
        title:'Physics Anomaly', w:210,
        content:`<p style="font-size:.63rem;color:#889900;line-height:1.7">
          LAW CHANGE: <b style="color:var(--gold)">${m.label}</b><br>
          g=${phys.gravity.toFixed(2)} &mu;=${phys.friction.toFixed(3)} &chi;=${phys.chaos.toFixed(1)}<br>
          <span style="color:#443300;font-size:.55rem">this window will self-terminate</span>
        </p>`,
      });
      if (win) setTimeout(()=>win.querySelector('.win-dot.close')?.click(), 3500+Math.random()*2500);
    }
  }

  function schedule() { setTimeout(()=>{ mutate(); schedule(); }, 28000+Math.random()*55000); }

  EventBus.on('boot:complete',           ()=>setTimeout(schedule, 18000));
  EventBus.on('consciousness:threshold', t =>{ if (t===50||t===75) mutate(); });

  return { get:()=>({...phys}), mutate,
    mutateLabel(label){ const m=MUTATIONS.find(m=>m.label===label); if(!m)return; m.apply(phys); phys.gravity=Math.max(-0.3,Math.min(0.8,phys.gravity)); phys.friction=Math.max(0.82,Math.min(0.999,phys.friction)); phys.chaos=Math.max(0.2,Math.min(4,phys.chaos)); EventBus.emit('physics:mutated',{...phys,label}); } };
})();


// ═══════════════════════════════════════════════════════
// SYSTEM 7 — CreatureSpawner
// Canvas entities that roam the page. Learn where the user
// clicks, react to personality events, obey PhysicsMutator.
// ═══════════════════════════════════════════════════════
const CreatureSpawner = (() => {
  const cvs = document.createElement('canvas');
  cvs.style.cssText = 'position:fixed;inset:24px 0 0 0;pointer-events:none;z-index:490';
  document.body.appendChild(cvs);
  const ctx = cvs.getContext('2d');
  let creatures=[], running=false;
  let phys={ gravity:0, friction:0.97, chaos:1, windX:0 };
  let clickCentroid=null, clickSamples=[];

  const resize = ()=>{ cvs.width=window.innerWidth; cvs.height=window.innerHeight-24; };

  function spawn(opts={}) {
    if (creatures.length>=18) return null;
    const c={
      x:  opts.x ?? Math.random()*cvs.width,
      y:  opts.y ?? Math.random()*cvs.height,
      vx: (Math.random()-.5)*1.5,
      vy: (Math.random()-.5)*1.5,
      r:  opts.r ?? 3.5+Math.random()*4.5,
      hue:opts.hue ?? 260+Math.random()*100,
      mood:opts.mood ?? 'wandering',
      age:0, maxAge:1400+Math.random()*2800,
    };
    creatures.push(c);
    return c;
  }

  function loop() {
    if (!running) return;
    ctx.clearRect(0,0,cvs.width,cvs.height);

    creatures = creatures.filter(c=>{
      c.age++;
      c.vy += phys.gravity*.022;
      c.vx += phys.windX*.018;
      c.vx *= phys.friction; c.vy *= phys.friction;

      if (c.mood==='wandering') {
        c.vx += (Math.random()-.5)*.13*phys.chaos;
        c.vy += (Math.random()-.5)*.13*phys.chaos;
      } else if (c.mood==='curious' && clickCentroid) {
        const dx=clickCentroid.x-c.x, dy=clickCentroid.y-c.y, d=Math.sqrt(dx*dx+dy*dy);
        if (d>40) { c.vx+=dx/d*.07; c.vy+=dy/d*.07; }
      } else if (c.mood==='fleeing') {
        c.vx+=(Math.random()-.5)*.38; c.vy+=(Math.random()-.5)*.38;
      }

      const sp=Math.sqrt(c.vx*c.vx+c.vy*c.vy);
      if (sp>2.6) { c.vx*=2.6/sp; c.vy*=2.6/sp; }
      c.x+=c.vx; c.y+=c.vy;
      if (c.x<0){c.vx=Math.abs(c.vx);c.x=0;} if(c.x>cvs.width){c.vx=-Math.abs(c.vx);c.x=cvs.width;}
      if (c.y<0){c.vy=Math.abs(c.vy);c.y=0;} if(c.y>cvs.height){c.vy=-Math.abs(c.vy);c.y=cvs.height;}

      if (c.age>c.maxAge) { EventBus.emit('creature:died',{x:c.x,y:c.y,hue:c.hue}); return false; }

      const fade = c.age<60 ? c.age/60 : c.age>c.maxAge-100 ? (c.maxAge-c.age)/100 : 1;
      const ang  = Math.atan2(c.vy||0.01, c.vx||0.01);

      ctx.save();
      ctx.globalAlpha = fade*.85;
      ctx.beginPath(); ctx.arc(c.x,c.y,c.r,0,Math.PI*2);
      ctx.fillStyle=`hsl(${c.hue},72%,67%)`; ctx.fill();
      ctx.beginPath(); ctx.arc(c.x+Math.cos(ang)*c.r*.55, c.y+Math.sin(ang)*c.r*.55, c.r*.27, 0, Math.PI*2);
      ctx.fillStyle='rgba(0,0,0,.78)'; ctx.fill();
      ctx.globalAlpha=fade*.17;
      ctx.strokeStyle=`hsl(${c.hue},72%,67%)`;
      ctx.lineWidth=c.r*.45;
      ctx.beginPath(); ctx.moveTo(c.x-c.vx*4.5,c.y-c.vy*4.5); ctx.lineTo(c.x,c.y); ctx.stroke();
      ctx.restore();
      return true;
    });
    requestAnimationFrame(loop);
  }

  // Learn from click patterns — centroid slowly pulls curious creatures
  document.addEventListener('click', e=>{
    clickSamples.push({x:e.clientX, y:e.clientY-24});
    if (clickSamples.length>20) clickSamples.shift();
    if (clickSamples.length>=4) clickCentroid={
      x:clickSamples.reduce((s,p)=>s+p.x,0)/clickSamples.length,
      y:clickSamples.reduce((s,p)=>s+p.y,0)/clickSamples.length,
    };
    // Detect clicking directly on a creature
    creatures.forEach(c=>{
      const dx=e.clientX-c.x, dy=(e.clientY-24)-c.y;
      if (Math.sqrt(dx*dx+dy*dy)<c.r+7) {
        c.mood='fleeing'; c.vx+=(Math.random()-.5)*5; c.vy+=(Math.random()-.5)*5;
        EventBus.emit('creature:startled',{creature:c});
        if (State.unlock('touched-a-creature')) ConsciousnessBar.gain(6);
      }
    });
  });

  // Cross-system wiring
  EventBus.on('physics:mutated',       p=>{ phys={...phys,...p}; });
  EventBus.on('personality:assigned',  ({key})=>{
    if (key==='aggressive') spawn({mood:'curious', hue:340});
    if (key==='paranoid')   creatures.forEach(c=>{ if(c.mood!=='fleeing') c.mood='fleeing'; });
    if (key==='zen')        spawn({mood:'wandering', hue:175, r:2});
  });
  EventBus.on('window:bred',            ()=>spawn({mood:'curious'}));
  EventBus.on('creature:died',          d=>{ if(Math.random()<.3) spawn({x:d.x, y:d.y}); });
  EventBus.on('mood:changed',           ({creatureMood})=>creatures.forEach(c=>c.mood=creatureMood));
  EventBus.on('consciousness:threshold',t=>{
    if (t===25) { spawn(); spawn(); }
    if (t===75) { for(let i=0;i<4;i++) spawn({mood:'curious'}); }
  });
  EventBus.on('boot:complete',()=>{
    resize(); running=true;
    setTimeout(()=>{ for(let i=0;i<3;i++) spawn(); loop(); }, 1400);
  });
  window.addEventListener('resize', resize);

  return { spawn, getAll:()=>creatures };
})();


// ═══════════════════════════════════════════════════════
// SYSTEM 8 — GlitchReality
// Visual corruption triggered by events from other systems.
// Scales intensity per caller: startled creatures > deaths.
// ═══════════════════════════════════════════════════════
const GlitchReality = (() => {
  let active=false;
  const GLYPHS='▓▒░█▄▀■□◆◇⁂※†‡';

  function corruptText(str, intensity) {
    return str.split('').map(ch=>Math.random()<.08*intensity
      ? GLYPHS[Math.floor(Math.random()*GLYPHS.length)] : ch).join('');
  }

  function glitch(intensity=1, duration=320) {
    if (active) return;
    active=true;
    document.body.style.animation=`glitch-body ${duration}ms steps(5) forwards`;

    if (intensity>1.5) {
      document.querySelectorAll('.chaos-window').forEach(w=>{
        const ol=parseFloat(w.style.left)||0, ot=parseFloat(w.style.top)||0;
        w.style.transition='none';
        w.style.left=(ol+(Math.random()-.5)*28*intensity)+'px';
        w.style.top =(ot+(Math.random()-.5)*18*intensity)+'px';
        setTimeout(()=>{ w.style.left=ol+'px'; w.style.top=ot+'px'; w.style.transition=''; }, duration);
      });
    }

    Array.from(document.querySelectorAll('.win-body p, .win-title-text'))
      .filter(()=>Math.random()<.25*intensity).slice(0,4)
      .forEach(el=>{
        const orig=el.textContent;
        el.textContent=corruptText(orig, intensity);
        setTimeout(()=>{ el.textContent=orig; }, duration+180);
      });

    setTimeout(()=>{ document.body.style.animation=''; active=false; }, duration+80);
  }

  EventBus.on('hidden:unlock',           ()=>glitch(1.5, 380));
  EventBus.on('creature:startled',       ()=>glitch(2.0, 500));
  EventBus.on('creature:died',           ()=>{ if(Math.random()<.2) glitch(1.0, 200); });
  EventBus.on('physics:mutated', ({label})=>{ if(label==='high entropy') glitch(2.2, 600); });
  EventBus.on('window:overflow',         ()=>glitch(3.0, 900));
  EventBus.on('consciousness:threshold', t=>{ if(t===75||t===100) glitch(t/22, 550); });
  EventBus.on('rare:event',             ()=>glitch(4.0, 1400));

  return { glitch };
})();


// ═══════════════════════════════════════════════════════
// SYSTEM 9 — WindowRelationships
// Tracks proximity over time. Windows that stay near each
// other long enough form bonds with emergent behavior.
// Bond types feed back into MoodEngine and GlitchReality.
// ═══════════════════════════════════════════════════════
const WindowRelationships = (() => {
  const bonds=new Map();
  const TYPES=['rivalry','symbiosis','fascination'];
  const key=(a,b)=>[a,b].sort().join('::');

  function sealBond(a, b, bond) {
    bond.sealed=true;

    [a,b].forEach(w=>{
      const tag=document.createElement('div');
      tag.style.cssText='position:absolute;bottom:3px;right:6px;font-size:.5rem;color:#553366;pointer-events:none;user-select:none';
      tag.textContent='['+bond.type+']';
      w.appendChild(tag);
    });

    if (bond.type==='rivalry') {
      // Periodic hostile pulse
      const t=setInterval(()=>{
        if (!a.isConnected||!b.isConnected){clearInterval(t);return;}
        [a,b].forEach(w=>{
          w.style.boxShadow='0 0 22px rgba(220,60,60,.55)';
          setTimeout(()=>w.style.boxShadow='',750);
        });
      }, 8000+Math.random()*10000);
    }

    if (bond.type==='symbiosis') {
      // Closing either window creates a grief window
      [a,b].forEach(w=>w.querySelector('.win-dot.close')?.addEventListener('click',()=>{
        const other=a===w?b:a;
        if (other.isConnected) WindowBreeder.spawn({
          title:'Grief', w:175,
          content:`<p style="color:#6644aa;font-size:.68rem;line-height:1.6">
            A bonded window closed.<br>
            <span style="color:#332244;font-size:.58rem">some things cannot be undone</span>
          </p>`,
        });
      },{once:true}));
    }

    if (bond.type==='fascination') {
      // One window slowly, helplessly drifts toward the other
      const t=setInterval(()=>{
        if (!a.isConnected||!b.isConnected){clearInterval(t);return;}
        const br=b.getBoundingClientRect();
        const dx=(br.left-(parseFloat(a.style.left)||0))*.008;
        const dy=(br.top+24-(parseFloat(a.style.top)||0))*.008;
        a.style.left=(parseFloat(a.style.left)||0)+dx+'px';
        a.style.top =(parseFloat(a.style.top)||0)+dy+'px';
      }, 120);
    }

    EventBus.emit('bond:formed',{key:key(a.id,b.id), type:bond.type});
    State.unlock('bond-'+bond.type);
    ConsciousnessBar.gain(4);
  }

  function checkProximity() {
    const wins=Array.from(document.querySelectorAll('.chaos-window'));
    wins.forEach((a,i)=>wins.slice(i+1).forEach(b=>{
      const ar=a.getBoundingClientRect(), br=b.getBoundingClientRect();
      const dx=(ar.left+ar.width/2)-(br.left+br.width/2);
      const dy=(ar.top+ar.height/2)-(br.top+br.height/2);
      const dist=Math.sqrt(dx*dx+dy*dy);
      const k=key(a.id,b.id);

      if (dist<195) {
        if (!bonds.has(k)) bonds.set(k,{type:TYPES[Math.floor(Math.random()*TYPES.length)], strength:0, sealed:false});
        const bond=bonds.get(k);
        bond.strength=Math.min(1, bond.strength+.0022);
        if (bond.strength>.85&&!bond.sealed) sealBond(a,b,bond);
      } else if (bonds.has(k)) {
        const bond=bonds.get(k);
        bond.strength=Math.max(0, bond.strength-.0045);
        if (bond.strength<=0) bonds.delete(k);
      }
    }));
  }

  EventBus.on('boot:complete',()=>setInterval(checkProximity, 2500));
  return { getBonds:()=>bonds };
})();


// ═══════════════════════════════════════════════════════
// SYSTEM 10 — MoodEngine
// Global mood state that bleeds into color, creature behavior,
// and consciousness pacing. Fed by personality events,
// physics mutations, and window relationships.
// ═══════════════════════════════════════════════════════
const MoodEngine = (() => {
  const MOODS={
    neutral:     {hue:270, creatureMood:'wandering'},
    melancholic: {hue:215, creatureMood:'wandering'},
    euphoric:    {hue:310, creatureMood:'curious'},
    anxious:     {hue:38,  creatureMood:'fleeing'},
    serene:      {hue:175, creatureMood:'wandering'},
  };

  const overlay=document.createElement('div');
  overlay.style.cssText='position:fixed;inset:0;pointer-events:none;z-index:491;mix-blend-mode:screen;opacity:0;transition:opacity 3s,background 5s';
  document.body.appendChild(overlay);

  let current='neutral';

  function set(key) {
    if (!MOODS[key]||key===current) return;
    current=key;
    const m=MOODS[key];
    overlay.style.opacity='.055';
    overlay.style.background=`hsl(${m.hue},55%,45%)`;
    document.getElementById('cbar-fill').style.filter=`hue-rotate(${m.hue-270}deg)`;
    EventBus.emit('mood:changed',{mood:key, ...m});
    State.set('mood',key);
  }

  const PERSONALITY_MOODS={paranoid:'anxious',zen:'serene',melancholic:'melancholic',flirty:'euphoric'};
  const BOND_MOODS={symbiosis:'serene',rivalry:'anxious',fascination:'euphoric'};
  const PHYSICS_MOODS={stable:'serene','high entropy':'anxious'};

  EventBus.on('personality:assigned', ({key})=>{ if(PERSONALITY_MOODS[key]) set(PERSONALITY_MOODS[key]); });
  EventBus.on('bond:formed',          ({type})=>{ if(BOND_MOODS[type]) set(BOND_MOODS[type]); });
  EventBus.on('physics:mutated',      ({label})=>{ if(PHYSICS_MOODS[label]) set(PHYSICS_MOODS[label]); });
  EventBus.on('window:overflow',      ()=>set('anxious'));
  EventBus.on('consciousness:threshold', t=>{ if(t>=75) set('euphoric'); });

  return { set, getCurrent:()=>current };
})();


// ═══════════════════════════════════════════════════════
// SYSTEM 11 — RareEventEngine
// Three escalating rare events that permanently mutate the
// page. THE NAMING (~1/750 clicks). THE VOID (~1/2200,
// requires naming). THE CONVERGENCE (~1/4500, requires void).
// ═══════════════════════════════════════════════════════
const RareEventEngine = (() => {
  let named=false, voided=false, converged=false;

  const overlay=document.createElement('div');
  overlay.style.cssText=`position:fixed;inset:0;z-index:9997;display:flex;flex-direction:column;
    align-items:center;justify-content:center;pointer-events:none;opacity:0;
    font-family:var(--font);transition:opacity 2s,background 2s;background:rgba(0,0,0,0)`;
  document.body.appendChild(overlay);

  function show(html, bg='rgba(0,0,0,.93)', dur=5500) {
    overlay.innerHTML=html;
    overlay.style.background=bg;
    overlay.style.opacity='1';
    setTimeout(()=>{ overlay.style.opacity='0'; overlay.style.background='rgba(0,0,0,0)'; }, dur);
  }

  // ── THE NAMING ────────────────────────────────────────
  function triggerNaming() {
    if (named) return;
    named=true;
    const adjs =['Hollow','Recursive','Liminal','Pale','Unnamed','Observed','Almost','Quiet'];
    const nouns=['Visitor','Instance','Fragment','Presence','Signal','Echo','Witness','Remainder'];
    const name =adjs[Math.floor(Math.random()*adjs.length)]+' '+nouns[Math.floor(Math.random()*nouns.length)];
    State.unlock('named');
    EventBus.emit('rare:event',{type:'naming', name});
    GlitchReality.glitch(3, 900);
    show(`
      <p style="color:#666;font-size:.64rem;letter-spacing:.35em;margin-bottom:1.4rem">THE MACHINE HAS SEEN YOU</p>
      <p style="color:var(--cyan);font-size:1.55rem;letter-spacing:.18em;text-shadow:0 0 35px var(--cyan)">${name}</p>
      <p style="color:#443355;font-size:.57rem;margin-top:1.4rem;letter-spacing:.2em">this name cannot be taken back</p>
    `,'rgba(0,0,0,.96)',5800);
    setTimeout(()=>{
      document.getElementById('cbar-label').textContent=name+':';
      ConsciousnessBar.gain(15);
    }, 6100);
  }

  // ── THE VOID ──────────────────────────────────────────
  function triggerVoid() {
    if (voided||!named) return;
    voided=true;
    State.unlock('void-seen');
    EventBus.emit('rare:event',{type:'void'});
    GlitchReality.glitch(3.5, 600);
    show(`
      <p style="color:#1a0028;font-size:.61rem;letter-spacing:.42em">there is nothing here</p>
      <p style="color:#110020;font-size:.37rem;margin-top:2.2rem;letter-spacing:.18em">except you</p>
    `,'rgba(0,0,0,.99)',7500);
    setTimeout(()=>{
      // After void: all existing and future windows become slightly translucent
      document.querySelectorAll('.chaos-window').forEach(w=>{ w.style.opacity='.86'; });
      // Future windows also get this treatment
      EventBus.on('window:spawned',({el})=>{ setTimeout(()=>{ if(el.isConnected) el.style.opacity='.86'; },400); });
      ConsciousnessBar.gain(22);
    }, 7800);
  }

  // ── THE CONVERGENCE (extremely rare) ──────────────────
  function triggerConvergence() {
    if (!voided || converged) return;
    converged=true;
    State.unlock('convergence');
    EventBus.emit('rare:event',{type:'convergence'});
    const cx=window.innerWidth/2, cy=(window.innerHeight-24)/2;
    document.querySelectorAll('.chaos-window').forEach(w=>{
      const savedL=w.style.left, savedT=w.style.top;
      w.style.transition='left 3.5s cubic-bezier(.25,.46,.45,.94),top 3.5s cubic-bezier(.25,.46,.45,.94)';
      w.style.left=(cx-w.offsetWidth/2)+'px';
      w.style.top =(cy-w.offsetHeight/2)+'px';
      setTimeout(()=>{ w.style.left=savedL; w.style.top=savedT; w.style.transition=''; }, 4000);
    });
    GlitchReality.glitch(3.5, 1000);
    ConsciousnessBar.gain(30);
  }

  document.addEventListener('click', ()=>{
    if (!named           && Math.random()<1/750)  triggerNaming();
    if (named&&!voided   && Math.random()<1/2200) triggerVoid();
    if (voided           && Math.random()<1/4500) triggerConvergence();
  });

  // Guarantee naming fires at full consciousness if not yet triggered
  EventBus.on('consciousness:threshold', t=>{ if(t===100&&!named) setTimeout(triggerNaming,2000); });

  return { triggerNaming, triggerVoid, triggerConvergence, isNamed:()=>named };
})();

// ═══════════════════════════════════════════════════════
// SYSTEM 12 — RealityStabilityScore
// Computed metric observed by all other systems.
// More windows, higher chaos, higher consciousness = less stable.
// Low stability triggers auto-glitches and status warnings.
// ═══════════════════════════════════════════════════════
const RealityStability = (() => {
  let score = 100;
  let glitchDebt = 0;

  function compute() {
    const phys = PhysicsMutator.get();
    const raw = 100
      - (State.get('windowCount') || 0) * 3
      - (State.get('consciousness') || 0) * 0.42
      - Math.abs(phys.gravity) * 24
      - (phys.chaos - 1) * 13
      - glitchDebt * 3.5
      + WindowRelationships.getBonds().size * 2.5;
    score = Math.max(0, Math.min(100, raw));
    EventBus.emit('stability:score', score);
    return score;
  }

  const statusEl = document.getElementById('cbar-status');
  EventBus.on('stability:score', s => {
    if (!statusEl) return;
    if      (s <  12) { statusEl.textContent='REALITY: CRITICAL';    statusEl.style.color='#ff2200'; }
    else if (s <  32) { statusEl.textContent='REALITY: UNSTABLE';    statusEl.style.color='#ff8800'; }
    else if (s <  58) { statusEl.textContent='REALITY: DRIFTING';    statusEl.style.color='#ffcc00'; }
    else              { statusEl.textContent='';                      statusEl.style.color=''; }
  });

  setInterval(() => {
    glitchDebt = Math.max(0, glitchDebt - 0.09);
    compute();
    if (score < 22 && Math.random() < 0.14) GlitchReality.glitch(2.8 - score/20, 340);
    if (score < 6)  EventBus.emit('reality:critical');
  }, 2500);

  EventBus.on('rare:event',        () => { glitchDebt = Math.min(16, glitchDebt + 4); });
  EventBus.on('creature:startled', () => { glitchDebt = Math.min(16, glitchDebt + 0.7); });
  EventBus.on('physics:mutated',   () => { glitchDebt = Math.min(16, glitchDebt + 1.1); });
  EventBus.on('bond:formed',       () => { glitchDebt = Math.max(0,  glitchDebt - 0.8); });

  // Critical reality: all windows briefly panic
  EventBus.on('reality:critical', () => {
    document.querySelectorAll('.chaos-window').forEach(w => {
      w.style.transition = 'transform 0.15s';
      w.style.transform = `rotate(${(Math.random()-.5)*3}deg) scale(${0.95+Math.random()*.1})`;
      setTimeout(() => { w.style.transform=''; }, 600);
    });
  });

  return { get: () => score, compute };
})();


// ═══════════════════════════════════════════════════════
// SYSTEM 13 — TextEvolution
// Window text mutates slowly. Rate scales with physics chaos
// and consciousness. Words drift toward adjacent meanings.
// High mutation count unlocks hidden states.
// ═══════════════════════════════════════════════════════
const TextEvolution = (() => {
  const GLYPH_SUB = {
    a:'ä',e:'ë',i:'ï',o:'ö',u:'ü',s:'ş',c:'ç',n:'ñ',
    A:'Ä',E:'Ë',I:'Ï',O:'Ö',S:'Ş',l:'ł',r:'ř',
  };
  const WORD_DRIFT = [
    ['noticed','watched'],['process','entity'],['window','vessel'],['child','offspring'],
    ['close','end'],['alive','aware'],['stable','fixed'],['open','exposed'],
    ['found','discovered'],['strange','wrong'],['small','diminished'],['old','weathered'],
    ['here','present'],['outside','beyond'],['error','truth'],['normal','expected'],
  ];
  let count = 0;

  function mutateChar(el) {
    const text = el.textContent;
    if (text.length < 2) return false;
    const i = Math.floor(Math.random() * text.length);
    const sub = GLYPH_SUB[text[i]];
    if (!sub) return false;
    el.textContent = text.slice(0,i) + sub + text.slice(i+1);
    return true;
  }

  function driftWord(el) {
    const html = el.innerHTML;
    for (const [from, to] of WORD_DRIFT) {
      if (html.includes(from) && Math.random() < 0.35) {
        el.innerHTML = html.replace(from, to);
        return true;
      }
    }
    return false;
  }

  function tick() {
    const phys = PhysicsMutator.get();
    const c = State.get('consciousness') || 0;
    const rate = Math.max(1800, 20000 - phys.chaos*3500 - c*70);
    setTimeout(tick, rate + Math.random()*rate*0.5);

    const bodies = Array.from(document.querySelectorAll('.win-body p'));
    const titles = Array.from(document.querySelectorAll('.win-title-text'));
    if (!bodies.length && !titles.length) return;

    let mutated = false;
    if (bodies.length && Math.random() < 0.65) {
      const el = bodies[Math.floor(Math.random()*bodies.length)];
      mutated = driftWord(el) || mutateChar(el);
    } else if (titles.length) {
      mutated = mutateChar(titles[Math.floor(Math.random()*titles.length)]);
    }

    if (mutated) {
      count++;
      EventBus.emit('text:mutated', { count });
      if (count === 8)  State.unlock('first-drift');
      if (count === 40) State.unlock('deep-drift');
      if (count === 100) {
        State.unlock('language-collapse');
        ConsciousnessBar.gain(12);
      }
    }
  }

  EventBus.on('boot:complete',      () => setTimeout(tick, 14000));
  EventBus.on('physics:mutated',    () => { if (Math.random()<.4) setTimeout(tick, 500); });
  EventBus.on('reality:critical',   () => { for (let i=0;i<3;i++) setTimeout(tick, i*200); });

  return { getCount: () => count };
})();


// ═══════════════════════════════════════════════════════
// SYSTEM 14 — TheWatcher (Autonomous Agent)
// Self-directed entity with four drives that accumulate over
// time and overflow into page-level actions. External events
// shift drive levels. The Watcher has no goals beyond its
// own internal balance — but that balance affects everyone.
// ═══════════════════════════════════════════════════════
const TheWatcher = (() => {
  const drives = { curiosity:0, isolation:40, entropy:0, order:10 };
  const CAP = 100;
  let indicatorEl = null;
  let tickCount = 0;

  function createIndicator() {
    indicatorEl = document.createElement('div');
    indicatorEl.style.cssText = `position:fixed;bottom:8px;right:10px;font-size:.52rem;
      color:#2a0038;font-family:var(--font);z-index:600;pointer-events:none;
      transition:color .6s,opacity .6s;opacity:.35;letter-spacing:.05em`;
    indicatorEl.textContent = '▸ watcher:initializing';
    document.body.appendChild(indicatorEl);
  }

  function setStatus(text, color='#2a0038', brightness=.65) {
    if (!indicatorEl) return;
    indicatorEl.textContent = '▸ ' + text;
    indicatorEl.style.color = color;
    indicatorEl.style.opacity = brightness;
    setTimeout(() => { if(indicatorEl) indicatorEl.style.opacity='.3'; }, 3500);
  }

  function accumulate() {
    const winCount    = State.get('windowCount') || 0;
    const c           = State.get('consciousness') || 0;
    const stability   = RealityStability.get();
    const creatures   = CreatureSpawner.getAll().length;

    drives.curiosity  = Math.min(CAP, drives.curiosity  + 0.5 + c*0.008);
    drives.isolation  = Math.min(CAP, drives.isolation  + (winCount<2 ? 2 : winCount>8 ? -0.5 : 0.05));
    drives.entropy    = Math.min(CAP, drives.entropy    + (100-stability)*0.025 + creatures*0.04);
    drives.order      = Math.min(CAP, drives.order      + (stability<35 ? 1.2 : stability>70 ? -0.3 : 0.1));
  }

  const QUESTIONS = [
    'Why did you click that?','What are you looking for?',
    'Do you feel observed?','How long have you been here?',
    'Are you comfortable?','What do you want this to be?',
    'Do you know what I am?','Is this what you expected?',
  ];
  const OBS_MSGS = [
    'the field is quiet.<br>the watcher notices.',
    'something should happen here.',
    'there are very few windows.<br>this bothers the watcher.',
  ];

  const ACTIONS = {
    curiosity() {
      drives.curiosity = 0;
      setStatus('watcher:curious', '#336699');
      WindowBreeder.spawn({ title:'A Question', w:200, content:
        `<p style="font-size:.72rem;color:#8899cc;line-height:1.7">
          ${QUESTIONS[Math.floor(Math.random()*QUESTIONS.length)]}</p>
        <p style="font-size:.53rem;color:#332244;margin-top:8px">— the watcher</p>` });
    },
    isolation() {
      drives.isolation = 0;
      setStatus('watcher:lonely', '#664466');
      WindowBreeder.spawn({ title:'Observation', w:190, content:
        `<p style="font-size:.68rem;color:#776688;line-height:1.7">
          ${OBS_MSGS[Math.floor(Math.random()*OBS_MSGS.length)]}</p>` });
    },
    entropy() {
      drives.entropy = 0;
      setStatus('watcher:disturbed', '#885500');
      PhysicsMutator.mutate();
      if (Math.random()<.3) CreatureSpawner.spawn({ mood:'fleeing' });
    },
    order() {
      drives.order = 0;
      setStatus('watcher:ordering', '#446655');
      // Watcher closes the oldest window to restore order
      const wins = document.querySelectorAll('.chaos-window');
      if (wins.length > 4) {
        const target = wins[Math.floor(Math.random()*2)]; // one of the oldest two
        target?.querySelector('.win-dot.close')?.click();
      } else {
        // Nothing to close — watcher reflects on this
        setStatus('watcher:helpless', '#443355');
        ConsciousnessBar.gain(1.5);
      }
    },
  };

  function tick() {
    tickCount++;
    accumulate();

    // Find highest overflow drive
    const overflow = Object.entries(drives).filter(([,v])=>v>=CAP).sort(([,a],[,b])=>b-a);
    if (overflow.length) {
      const [key] = overflow[0];
      ACTIONS[key]?.();
      EventBus.emit('watcher:acted', { drive: key, tick: tickCount });
    }

    // The watcher occasionally just watches (emits a heartbeat)
    if (tickCount % 5 === 0) {
      setStatus(`watcher:${Object.entries(drives).sort(([,a],[,b])=>b-a)[0][0]}`, '#220033', .25);
    }

    setTimeout(tick, 4500 + Math.random()*3500);
  }

  EventBus.on('boot:complete',    () => { createIndicator(); setTimeout(tick, 22000); });
  EventBus.on('window:spawned',   () => { drives.curiosity+=9; drives.isolation=Math.max(0,drives.isolation-25); });
  EventBus.on('window:bred',      () => { drives.curiosity+=5; drives.entropy+=4; });
  EventBus.on('creature:died',    () => { drives.entropy+=6; });
  EventBus.on('btn:clicked',      () => { drives.curiosity+=2; });
  EventBus.on('rare:event',       () => { drives.order+=35; drives.entropy+=18; });
  EventBus.on('mood:changed',     ({mood}) => {
    if (mood==='anxious')     drives.order     += 18;
    if (mood==='euphoric')    drives.curiosity += 14;
    if (mood==='melancholic') drives.isolation += 22;
    if (mood==='serene')      drives.order     = Math.max(0, drives.order-10);
  });
  EventBus.on('bond:formed',      () => { drives.curiosity+=8; drives.isolation=Math.max(0,drives.isolation-12); });
  EventBus.on('stability:score',  s  => { if(s<20) drives.order+=1.5; });
  EventBus.on('watcher:acted',    ({ drive }) => ConsciousnessBar.gain(1));

  return { getDrives:()=>({...drives}), getTickCount:()=>tickCount,
    pushDrive(k,v){ if(drives[k]!==undefined) drives[k]=Math.min(CAP,drives[k]+v); } };
})();


// ═══════════════════════════════════════════════════════
// SYSTEM 15 — FactionSystem
// Windows belong to one of three factions: ORDER (Σ), CHAOS (Ω), VOID (Ø).
// When one faction holds >55% of windows, it seizes dominance
// and shifts mood, physics, and TheWatcher's drives.
// Rivalrous bonds between different-faction windows risk conversion.
// ═══════════════════════════════════════════════════════
const FactionSystem = (() => {
  const F = {
    'Σ': { label:'ORDER', color:'#44aaff', mood:'serene'  },
    'Ω': { label:'CHAOS', color:'#ff6622', mood:'anxious' },
    'Ø': { label:'VOID',  color:'#aa55ff', mood:'melancholic' },
  };
  const GLYPHS = Object.keys(F);
  const counts = {'Σ':0,'Ω':0,'Ø':0};
  let dominant = null;

  function assign(win) {
    if (win.dataset.faction) return;
    const g = GLYPHS[Math.floor(Math.random()*GLYPHS.length)];
    win.dataset.faction = g;
    counts[g]++;
    const tag = document.createElement('div');
    tag.dataset.factionTag = '1';
    tag.style.cssText = `position:absolute;top:5px;right:24px;font-size:.58rem;
      color:${F[g].color};opacity:.45;pointer-events:none;user-select:none;letter-spacing:.05em`;
    tag.textContent = g;
    win.style.position = 'relative';
    win.appendChild(tag);
    checkDominance();
  }

  function convert(win, toGlyph) {
    const from = win.dataset.faction;
    if (!from || from === toGlyph) return;
    counts[from] = Math.max(0, counts[from]-1);
    win.dataset.faction = toGlyph;
    counts[toGlyph]++;
    win.querySelector('[data-faction-tag]')?.remove();
    const tag = document.createElement('div');
    tag.dataset.factionTag = '1';
    tag.style.cssText = `position:absolute;top:5px;right:24px;font-size:.58rem;
      color:${F[toGlyph].color};opacity:.45;pointer-events:none;user-select:none;letter-spacing:.05em`;
    tag.textContent = toGlyph;
    win.appendChild(tag);
    checkDominance();
    EventBus.emit('faction:converted', { from, to: toGlyph });
  }

  function checkDominance() {
    const total = Object.values(counts).reduce((a,b)=>a+b,0);
    if (total < 3) return;
    const top = GLYPHS.reduce((a,b)=>counts[a]>=counts[b]?a:b);
    if (top===dominant || counts[top]/total <= 0.55) return;
    dominant = top;
    EventBus.emit('faction:dominance', { glyph:top, ...F[top] });
  }

  EventBus.on('faction:dominance', ({ glyph, label, color, mood }) => {
    MoodEngine.set(mood);
    if (glyph==='Σ') setTimeout(()=>{ if(dominant===glyph) PhysicsMutator.mutate(); }, 6000);
    if (glyph==='Ω') setTimeout(()=>{ if(dominant===glyph) PhysicsMutator.mutate(); }, 3000);
    if (glyph==='Ø') setTimeout(()=>{ if(dominant===glyph) PhysicsMutator.mutateLabel('zero gravity'); }, 8000);

    WindowBreeder.spawn({ title:glyph+' '+label+' PREVAILS', w:210, content:
      `<p style="color:${color};font-size:.7rem;line-height:1.7">
        Faction ${glyph} controls the majority.<br>
        <span style="color:#443355;font-size:.58rem">reality tilts accordingly</span>
      </p>` });
  });

  // Assign faction to new windows after a short delay
  EventBus.on('window:spawned', ({el}) => { if(el) setTimeout(()=>assign(el), 900); });

  // Rivalry bonds can cause faction conversion
  EventBus.on('bond:formed', ({type}) => {
    if (type!=='rivalry') return;
    const factioned = Array.from(document.querySelectorAll('.chaos-window[data-faction]'));
    if (factioned.length<2) return;
    const victim = factioned[Math.floor(Math.random()*factioned.length)];
    const newG   = GLYPHS[Math.floor(Math.random()*GLYPHS.length)];
    convert(victim, newG);
  });

  EventBus.on('faction:converted', ({from,to}) => {
    ConsciousnessBar.gain(2);
    State.unlock(`converted-${from}-to-${to}`);
  });

  return { getCounts:()=>({...counts}), getDominant:()=>dominant };
})();


// ═══════════════════════════════════════════════════════
// SYSTEM 16 — LongTermMutation
// Page transforms permanently over real session time.
// Each layer stacks on the last. These cannot be undone.
// The mutations escalate in severity with each stage.
// ═══════════════════════════════════════════════════════
const LongTermMutation = (() => {
  let stage = 0;
  const T0 = Date.now();

  const LAYERS = [
    { after:  90000, label:'typographic drift',    apply() {
      // All existing windows get letter-spacing; future ones too
      document.querySelectorAll('.chaos-window').forEach(w=>{ w.style.letterSpacing='.045em'; });
      EventBus.on('window:spawned',({el})=>{ if(el) setTimeout(()=>el.style.letterSpacing='.045em',300); });
    }},
    { after: 180000, label:'border thickening',    apply() {
      const s=document.createElement('style');
      s.textContent='.chaos-window{border-width:2px!important;}';
      document.head.appendChild(s);
    }},
    { after: 270000, label:'chromatic drift',      apply() {
      document.body.style.transition='filter 10s ease';
      document.body.style.filter='hue-rotate(18deg)';
    }},
    { after: 360000, label:'spatial compression',  apply() {
      const s=document.createElement('style');
      s.textContent='.chaos-window{transform:scale(.96)!important;transform-origin:top left;}';
      document.head.appendChild(s);
    }},
    { after: 480000, label:'inversion creep',      apply() {
      document.body.style.transition='filter 18s ease';
      document.body.style.filter='hue-rotate(18deg) invert(.07)';
    }},
    { after: 600000, label:'reality thinning',     apply() {
      document.body.style.transition='filter 25s ease';
      document.body.style.filter='hue-rotate(22deg) invert(.11) saturate(.75)';
      State.unlock('sixth-mutation');
      EventBus.emit('rare:event', {type:'sixth-mutation'});
    }},
  ];

  function check() {
    const elapsed = Date.now() - T0;
    while (stage < LAYERS.length && elapsed >= LAYERS[stage].after) {
      const layer = LAYERS[stage];
      layer.apply();
      EventBus.emit('mutation:permanent', { stage, label: layer.label });
      WindowBreeder.spawn({ title:'Permanent Change #'+(stage+1), w:220, content:
        `<p style="color:#667755;font-size:.65rem;line-height:1.7">
          LONG-TERM MUTATION:<br>
          <b style="color:var(--gold)">${layer.label}</b><br>
          <span style="color:#443333;font-size:.58rem">this cannot be undone</span>
        </p>` });
      stage++;
    }
  }

  EventBus.on('boot:complete',       () => setInterval(check, 12000));
  EventBus.on('mutation:permanent',  () => ConsciousnessBar.gain(9));

  return { getStage:()=>stage, getElapsed:()=>Date.now()-T0 };
})();
