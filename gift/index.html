<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Surprise</title>
  <link rel="icon" type="image/x-icon" href="../assets/eyes.png">
  <style>
    /* General Reset */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* Body styling */
    body {
      font-family: 'Arial', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #6a11cb, #2575fc);
      color: #ffffff;
      text-align: center;
      padding: 20px;
    }

    /* Typography */
    h1 {
      font-size: 2.5rem;
      margin-bottom: 1rem;
      text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.2);
    }

    p {
      font-size: 1.5rem;
      font-weight: 300;
      background: rgba(255, 255, 255, 0.2);
      padding: 10px 20px;
      border-radius: 10px;
      display: inline-block;
      text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.2);
    }

    img {
        max-width: 50%;
        width: 200px;
        border-radius: 15px;
        box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.5);
        position: absolute;
        cursor: pointer;
        top: 60%;
          transition: transform 0.3s;
        }
  
        img:hover {
          transform: scale(1.1);

      }

      

    /* Add a smooth fade-in animation */
    #ip {
      opacity: 0;
      animation: fadeIn 1s ease-in-out forwards;
    }

    /* Keyframes for fade-in */
    @keyframes fadeIn {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }
  </style>
</head>
<body>
  <h1>Your IP Address:⠀</h1>
  <p id="ip">Loading...</p>
  <img src="../assets/ip.gif" alt="Descriptive Image" onclick="window.location.href='http://www.patience-is-a-virtue.org/'" target="_blank">

  <script>
    // Fetch the visitor's IP address from ipify
    fetch('https://api.ipify.org?format=json')
      .then(response => response.json())
      .then(data => {
        // Display the IP address
        document.getElementById('ip').textContent = data.ip;
      })
      .catch(error => {
        document.getElementById('ip').textContent = 'Unable to fetch IP.';
        console.error('Error fetching IP:', error);
      });
  </script>
</body>
</html>
