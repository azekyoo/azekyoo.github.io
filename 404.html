<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Where are you?</title>
    <link rel="icon" type="image/x-icon" href="../assets/alert.gif">
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f8f9fa;
            color: #333;
            text-align: center;
        }

        h1 {
            font-size: 3rem;
            margin: 0;
        }

        p {
            font-size: 1.2rem;
        }

        a {
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #007bff;
            color: #fff;
            text-decoration: none;
            border-radius: 5px;
        }

        a:hover {
            background-color: #0056b3;
        }

        body {
            background: linear-gradient(135deg, #add8e6, #f2a6d2);
            background-size: 500% 500%;
            animation: gradientAnimation 7s ease infinite;
        }

        @keyframes gradientAnimation {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        html {
            width: 100%;
            height: 100%;
            color: white;
        }

        body {
            font-family: Raleway, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            padding: 0;
            margin: 0;
        }

        .fancy-wipe {
            margin: 0;
            font-weight: 900;
            font-size: 6rem;
            position: relative;
            --duration: 2.5s;
            --easing: cubic-bezier(0.45, 0, 0.55, 1);
            --colors: linear-gradient(90deg,
                    #fff89a,
                    #cdf2ca,
                    #a2cdcd,
                    #d1e8e4,
                    #cab8ff,
                    #ff7878,
                    #ffc898);
        }

        .text {
            display: block;
            padding: 2rem;
            color: white;
            animation: wipe-in var(--duration) infinite var(--easing);
            mask: linear-gradient(to right, white, white 45%, black, 55%, black);
            mask-composite: exclude;
            mask-mode: luminance;
            mask-size: 300% 100%;
            mask-position: 100% 0px;
        }

        .wipe-in {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            padding: 2rem;
            background-image: var(--colors);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: wipe-in var(--duration) infinite var(--easing);
            mask: linear-gradient(to right, black, black 45%, white 50%, black 52.5%, black);
            mask-composite: exclude;
            mask-mode: luminance;
            mask-size: 300% 100%;
            mask-position: 100% 0px;
        }

        .blur-in {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            padding: 2rem;
            background-image: var(--colors);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: wipe-in var(--duration) infinite var(--easing);
            mask: linear-gradient(to right, black, black 45%, white 52.5%, black 55%, black);
            mask-composite: exclude;
            mask-mode: luminance;
            mask-size: 300% 100%;
            mask-position: 100% 0px;
            filter: blur(10px);
        }

        @keyframes wipe-in {
            100% {
                mask-position: 0px 0px;
            }
        }

        @property --a {
            syntax: "<percentage>";
            initial-value: 0%;
            inherits: true;
        }

        .dark button {
            --a: 0%;
            --hue: 170deg;
            --x: 50;
            --y: 50;
            --button: hsl(var(--hue), 66%, 66%);
            --edge: 20px;
            --size: 2em;

            background: transparent;
            border: none;
            color: hsla(var(--hue), 80%, 30%, 0.7);
            font-size: 1.8em;
            position: absolute;
            top: 70%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: calc(var(--size)) calc(var(--size)*1.5);
            animation: color 20s linear infinite both;
            transition:
                --a .5s ease-in-out,
                scale var(--spring-duration) var(--spring-easing);
            scale: 0.92;
            isolation: isolate;

            &:hover {
                --a: 100%;
                transition-duration: .5s, 1s;
                box-shadow: none;
                opacity: 1;
                scale: 1;
            }

            cursor: pointer;
        }

        button:before {
            content: "";
            position: absolute;
            inset: 0em;
            /** here's the magic. A blur and a svg filter */
            filter: blur(12px) url(#goo) drop-shadow(0 .25em .5em hsla(0deg, 0%, 0%, 0.8));
            /** followed by a radial-gradient which causes the
            gooey effect to follow mouse-position */
            background-image:
                linear-gradient(0deg, var(--button), var(--button)),
                radial-gradient(40% 70% at calc(var(--x) * 1%) calc(var(--y) * 1%),
                    hsla(var(--hue), 77%, 77%, var(--a)) 0%,
                    transparent 90%);
            /** and finally a background-clip so the radial-gradient
            is larger than the linear-gradient */
            background-clip: content-box, border-box;
            padding: 24px;
            z-index: -1;
            border: inherit;
            animation: color 20s linear infinite both;
        }


        @property --hue {
            syntax: "<angle>";
            initial-value: 170deg;
            inherits: false;
        }

        @keyframes color {
            from {
                --hue: 170deg;
            }

            to {
                --hue: 530deg;
            }
        }

        body,
        html {
            height: 100%;
        }

        main {
            display: grid;
            place-items: center;
            color: var(--light);
            text-align: center;
        }

        :root {
            --spring-easing: linear(0, 0.002, 0.01 0.9%, 0.038 1.8%, 0.156, 0.312 5.8%, 0.789 11.1%, 1.015 14.2%,
                    1.096, 1.157, 1.199, 1.224 20.3%, 1.231, 1.231, 1.226, 1.214 24.6%,
                    1.176 26.9%, 1.057 32.6%, 1.007 35.5%, 0.984, 0.968, 0.956, 0.949 42%,
                    0.946 44.1%, 0.95 46.5%, 0.998 57.2%, 1.007, 1.011 63.3%, 1.012 68.3%,
                    0.998 84%, 1);
            --spring-duration: 1.66s;
        }
    </style>
</head>

<body>
    <h1 class="fancy-wipe" style="--colors: linear-gradient(
        90deg,
        rgba(255, 0, 0, 1) 0%,
        rgba(255, 154, 0, 1) 10%,
        rgba(208, 222, 33, 1) 20%,
        rgba(79, 220, 74, 1) 30%,
        rgba(63, 218, 216, 1) 40%,
        rgba(47, 201, 226, 1) 50%,
        rgba(28, 127, 238, 1) 60%,
        rgba(95, 21, 242, 1) 70%,
        rgba(186, 12, 248, 1) 80%,
        rgba(251, 7, 217, 1) 90%,
        rgba(255, 0, 0, 1) 100%
    );">
        <span class="text">
            404 - Page Not Found
        </span>
        <span class="wipe-in">
            404 - Page Not Found
        </span>
        <span class="blur-in">
            404 - Page Not Found
        </span>
    </h1>
    <main id="app" class="dark">
        <div>

            <button type="button" onclick="window.location.href='/'">
                Back to Home
            </button>
        </div>

    </main>

    <svg width="0" height="0" style="position: absolute;">
        <filter id="goo" x="-50%" y="-50%" width="200%" height="200%">
            <feComponentTransfer>
                <feFuncA type="discrete" tableValues="0 1"></feFuncA>
            </feComponentTransfer>
            <feGaussianBlur stdDeviation="5"></feGaussianBlur>
            <feComponentTransfer>
                <feFuncA type="table" tableValues="-5 11"></feFuncA>
            </feComponentTransfer>
        </filter>
    </svg>


    <script>
        function moveBg(e) {
            const rect = e.target.getBoundingClientRect();
            e.target.style.setProperty('--x', (e.clientX - rect.x) / rect.width * 100);
            e.target.style.setProperty('--y', (e.clientY - rect.y) / rect.height * 100);
        }
        document.querySelector("button").addEventListener('pointermove', moveBg);


























        /** just some JS for the intro animation, nothing here is needed
        for the gooey interaction. **/
        let x;
        function intro() {
            let i = 4;
            let $b = document.querySelector("button");
            $b.style.setProperty("--a", '100%');
            x = setInterval(() => {
                $b.style.setProperty(
                    "--x", ((Math.cos(i) + 2) / 3.6) * 100
                );
                $b.style.setProperty(
                    "--y", ((Math.sin(i) + 2) / 3.6) * 100
                );
                i += 0.03;
                if (i > 11.5) {
                    clearInterval(x);
                    $b.style.setProperty("--a", '');
                }
            }, 16);
        }
        intro();
        document.querySelector("button").addEventListener('pointerover', (e) => {
            clearInterval(x);
            e.target.style.setProperty("--a", '');
        });

    </script>
</body>

</html>
